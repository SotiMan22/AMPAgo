<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear / Editar Actividad - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .form-container {
      max-width: 600px;
      margin: auto;
    }
    input, select, textarea {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px;
    }
  </style>
</head>

<body>

<header>
  Actividad

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container form-container">

  <h2 id="titulo">Crear actividad</h2>

  <input id="nombre" type="text" placeholder="Nombre de la actividad">
  <input id="dia1" type="text" placeholder="Día 1 (lunes, martes...)">
  <input id="dia2" type="text" placeholder="Día 2 (opcional)">
  <textarea id="descripcion" placeholder="Descripción"></textarea>

  <label>Monitor</label>
  <select id="monitor"></select>

  <label>Material</label>
  <select id="material"></select>

  <label>Zona</label>
  <select id="zona"></select>

  <button id="btnGuardar">Guardar actividad</button>
  <button onclick="location.href='./actividades-admin-monitor.html'">Cancelar</button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ============================================================
   SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* ============================================================
   PERFIL
============================================================ */
const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (!profile || (profile.role !== "admin" && profile.role !== "monitor")) {
  alert("Acceso restringido");
  location.href = "./login.html";
}

document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: " + profile.role;

/* ============================================================
   CARGAR SELECTS
============================================================ */
async function cargarSelects() {

  // Monitores
  const { data: monitores } = await supabase
    .from("profiles")
    .select("id, nombre, apellidos, role")
    .eq("role", "monitor");

  const selMonitor = document.getElementById("monitor");
  selMonitor.innerHTML = monitores.map(m =>
    `<option value="${m.id}">${m.nombre} ${m.apellidos}</option>`
  ).join("");

  // Materiales
  const { data: materiales } = await supabase
    .from("materiales")
    .select("*");

  const selMaterial = document.getElementById("material");
  selMaterial.innerHTML = materiales.map(m =>
    `<option value="${m.id}">${m.nombre}</option>`
  ).join("");

  // Zonas
  const { data: zonas } = await supabase
    .from("zonas")
    .select("*");

  const selZona = document.getElementById("zona");
  selZona.innerHTML = zonas.map(z =>
    `<option value="${z.id}">${z.nombre}</option>`
  ).join("");
}

cargarSelects();

/* ============================================================
   GUARDAR ACTIVIDAD
============================================================ */
document.getElementById("btnGuardar").onclick = async () => {

  const nombre = document.getElementById("nombre").value.trim();
  const dia1 = document.getElementById("dia1").value.trim();
  const dia2 = document.getElementById("dia2").value.trim();
  const descripcion = document.getElementById("descripcion").value.trim();
  const monitor_id = document.getElementById("monitor").value;
  const material_id = document.getElementById("material").value;
  const zona_id = document.getElementById("zona").value;

  if (!nombre || !dia1 || !descripcion) {
    alert("Rellena todos los campos obligatorios");
    return;
  }

  const { error } = await supabase
    .from("actividades")
    .insert({
      nombre,
      dia1,
      dia2,
      descripcion,
      monitor_id,
      material_id,
      zona_id
    });

  if (error) {
    alert("Error guardando actividad");
    console.error(error);
    return;
  }

  alert("Actividad creada correctamente");
  location.href = "./actividades-admin-monitor.html";
};

/* ============================================================
   LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  location.href = "./login.html";
};
</script>

</body>
</html>
