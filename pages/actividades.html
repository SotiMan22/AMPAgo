<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividades - Admin/Monitor</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .fila-seleccionada {
      background-color: #ffe08a !important;
    }
    .boton-desactivado {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>

<body>

<header>
  Actividades

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- BOTONES SUPERIORES -->
  <button onclick="location.href='./admin.html'">Volver</button>
  <button id="btnCrear">Crear actividad</button>
  <button onclick="location.href='./login.html'">Inicio</button>

  <h2>Actividades</h2>

  <table id="tabla">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Día 1</th>
        <th>Día 2</th>
        <th>Descripción</th>
        <th>Monitor</th>
        <th>Material</th>
        <th>Zona</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <br>

  <!-- BOTONES DE ACCIÓN -->
  <button id="btnModificar" class="boton-desactivado">Modificar</button>
  <button id="btnEliminar" class="boton-desactivado">Eliminar</button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

let actividadSeleccionada = null;
let filaSeleccionada = null;

/* ============================================================
   SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* ============================================================
   PERFIL
============================================================ */
const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (!profile || (profile.role !== "admin" && profile.role !== "monitor")) {
  alert("Acceso restringido");
  location.href = "./login.html";
}

const role = profile.role;

document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: " + role;

/* ============================================================
   CARGAR ACTIVIDADES CON NOMBRES REALES
============================================================ */
async function cargar() {
  let query = supabase
    .from("actividades")
    .select(`
      id,
      nombre,
      dia1,
      dia2,
      descripcion,
      monitor_id,
      material_id,
      zona_id,
      profiles (nombre, apellidos),
      materiales (nombre),
      zonas (nombre)
    `);

  if (role === "monitor") {
    query = query.eq("monitor_id", user.id);
  }

  const { data, error } = await query;

  if (error) {
    alert("Error cargando actividades");
    console.error(error);
    return;
  }

  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  data.forEach(a => {
    const monitorNombre = a.profiles?.nombre
      ? `${a.profiles.nombre} ${a.profiles.apellidos}`
      : "Sin monitor";

    const materialNombre = a.materiales?.nombre || "Sin material";
    const zonaNombre = a.zonas?.nombre || "Sin zona";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.nombre}</td>
      <td>${a.dia1}</td>
      <td>${a.dia2 || ""}</td>
      <td>${a.descripcion}</td>
      <td>${monitorNombre}</td>
      <td>${materialNombre}</td>
      <td>${zonaNombre}</td>
    `;
    tr.onclick = () => seleccionarFila(tr, a.id);
    cont.appendChild(tr);
  });
}

cargar();

/* ============================================================
   SELECCIONAR / DESELECCIONAR FILA
============================================================ */
function seleccionarFila(fila, id) {

  // Si haces clic en la misma fila → desmarcar
  if (filaSeleccionada === fila) {
    filaSeleccionada.classList.remove("fila-seleccionada");
    filaSeleccionada = null;
    actividadSeleccionada = null;

    document.getElementById("btnModificar").classList.add("boton-desactivado");
    document.getElementById("btnEliminar").classList.add("boton-desactivado");
    return;
  }

  // Quitar selección previa
  document.querySelectorAll("#lista tr").forEach(tr => tr.classList.remove("fila-seleccionada"));

  // Marcar nueva fila
  fila.classList.add("fila-seleccionada");
  filaSeleccionada = fila;
  actividadSeleccionada = id;

  // Activar botones
  document.getElementById("btnModificar").classList.remove("boton-desactivado");
  document.getElementById("btnEliminar").classList.remove("boton-desactivado");
}

/* ============================================================
   DESELECCIONAR SI HACES CLIC FUERA DE LA TABLA
============================================================ */
document.addEventListener("click", (e) => {
  const tabla = document.getElementById("tabla");

  if (!tabla.contains(e.target)) {
    if (filaSeleccionada) {
      filaSeleccionada.classList.remove("fila-seleccionada");
      filaSeleccionada = null;
      actividadSeleccionada = null;

      document.getElementById("btnModificar").classList.add("boton-desactivado");
      document.getElementById("btnEliminar").classList.add("boton-desactivado");
    }
  }
});

/* ============================================================
   MODIFICAR
============================================================ */
document.getElementById("btnModificar").onclick = () => {
  if (!actividadSeleccionada) return;
  location.href = `./modificar-actividad.html?id=${actividadSeleccionada}`;
};

/* ============================================================
   ELIMINAR
============================================================ */
document.getElementById("btnEliminar").onclick = async () => {
  if (!actividadSeleccionada) return;

  const seguro = confirm("¿Seguro que quieres eliminar esta actividad?");
  if (!seguro) return;

  await supabase.from("actividades").delete().eq("id", actividadSeleccionada);

  alert("Actividad eliminada");
  actividadSeleccionada = null;

  document.getElementById("btnModificar").classList.add("boton-desactivado");
  document.getElementById("btnEliminar").classList.add("boton-desactivado");

  cargar();
};

/* ============================================================
   CREAR
============================================================ */
document.getElementById("btnCrear").onclick = () => {
  if (role !== "admin") {
    alert("Solo el administrador puede crear actividades");
    return;
  }
  location.href = "./actividades-form.html";
};

/* ============================================================
   LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  location.href = "./login.html";
};
</script>

</body>
</html>
