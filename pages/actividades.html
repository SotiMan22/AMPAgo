<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividades - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .seleccionada {
      background-color: #d0ebff !important;
    }
    #tablaActividades tr {
      cursor: pointer;
    }
    .nav-container {
      margin: 10px 0 20px 0;
    }
    .nav-btn {
      background: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<header>Actividades</header>

<div class="container">

  <div class="nav-container">
    <button id="btnVolver" class="nav-btn">Volver</button>
    <button id="btnInicio" class="nav-btn">Inicio</button>
  </div>

  <h2>Lista de actividades</h2>

  <input id="buscador" type="text" placeholder="Buscar actividad...">

  <div id="adminControls" style="display:none; margin-top:10px;">
    <button id="btnCrear">Crear actividad</button>
    <button id="btnModificar" disabled>Modificar</button>
    <button id="btnEliminar" disabled>Eliminar</button>
  </div>

  <table id="tablaActividades">
    <thead>
      <tr>
        <th></th>
        <th>Nombre</th>
        <th>Día 1</th>
        <th>Día 2</th>
        <th>Descripción</th>
        <th>Monitor</th>
        <th>Material</th>
        <th>Zona</th>
      </tr>
    </thead>
    <tbody id="tbodyActividades">
      <tr><td colspan="8">Cargando actividades...</td></tr>
    </tbody>
  </table>

</div>

<!-- MODAL -->
<div id="modalEliminar" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Confirmar eliminación</h3>
    <button id="confirmarEliminar">Sí, eliminar</button>
    <button id="cancelarEliminar">Cancelar</button>
  </div>
</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

let actividades = [];
let seleccionada = null;

/* ================= SESIÓN ================= */
const esInvitado = sessionStorage.getItem("invitado") === "true";
const { data: { user } } = await supabase.auth.getUser();

if (!user && !esInvitado) {
  location.href = "login.html";
}

/* ================= NAVEGACIÓN ================= */
async function navegar() {
  if (esInvitado) {
    location.href = "invitado.html";
    return;
  }

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    location.href = "login.html";
    return;
  }

  const { data: profile } = await supabase
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .maybeSingle();

  switch (profile?.role) {
    case "admin": location.href = "admin.html"; break;
    case "monitor": location.href = "monitor.html"; break;
    case "familiar": location.href = "familiar.html"; break;
    default: location.href = "login.html";
  }
}

document.getElementById("btnVolver").onclick = navegar;

/* 🔥 BOTÓN INICIO — CERRAR SESIÓN SIEMPRE */
document.getElementById("btnInicio").onclick = async () => {
  await supabase.auth.signOut();
  sessionStorage.removeItem("invitado");
  localStorage.removeItem("invitado");
  location.href = "login.html";
};

/* ================= PERMISOS ================= */
let puedeGestionar = false;

if (user && !esInvitado) {
  const { data: perfilData } = await supabase
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .maybeSingle();

  puedeGestionar = perfilData?.role === "admin" || perfilData?.role === "monitor";
}

if (puedeGestionar) {
  document.getElementById("adminControls").style.display = "block";
}

/* ================= CARGAR ACTIVIDADES ================= */
async function cargarActividades() {
  const { data, error } = await supabase
    .from("actividades")
    .select("*")
    .order("nombre");

  if (error) {
    document.getElementById("tbodyActividades").innerHTML =
      `<tr><td colspan="8">Error cargando actividades</td></tr>`;
    return;
  }

  actividades = data || [];
  pintarTabla(actividades);
}

/* ================= TABLA ================= */
async function pintarTabla(lista) {
  const tbody = document.getElementById("tbodyActividades");

  if (!lista.length) {
    tbody.innerHTML = `<tr><td colspan="8">No hay actividades</td></tr>`;
    return;
  }

  let html = "";

  for (const a of lista) {

    // MATERIAL
    let nombreMaterial = "Sin material";
    if (a.material_id) {
      const { data } = await supabase
        .from("materiales")
        .select("nombre")
        .eq("id", a.material_id)
        .maybeSingle();
      if (data) nombreMaterial = data.nombre;
    }

    // ZONA
    let nombreZona = "Sin zona";
    if (a.zona_id) {
      const { data } = await supabase
        .from("zonas")
        .select("nombre")
        .eq("id", a.zona_id)
        .maybeSingle();
      if (data) nombreZona = data.nombre;
    }

    // MONITOR
    let nombreMonitor = "Sin monitor";
    if (a.monitor_id) {
      const { data } = await supabase
        .from("profiles")
        .select("nombre, apellidos")
        .eq("id", a.monitor_id)
        .maybeSingle();
      if (data) nombreMonitor = `${data.nombre} ${data.apellidos || ""}`.trim();
    }

    html += `
      <tr data-id="${a.id}">
        <td></td>
        <td>${a.nombre}</td>
        <td>${a.dia1 || ""}</td>
        <td>${a.dia2 || ""}</td>
        <td>${a.descripcion || ""}</td>
        <td>${nombreMonitor}</td>
        <td>${nombreMaterial}</td>
        <td>${nombreZona}</td>
      </tr>
    `;
  }

  tbody.innerHTML = html;

  document.querySelectorAll("#tablaActividades tbody tr")
    .forEach(tr => tr.onclick = () => seleccionarFila(tr));
}

/* ================= SELECCIÓN ================= */
function seleccionarFila(tr) {
  document.querySelectorAll("#tablaActividades tr")
    .forEach(r => r.classList.remove("seleccionada"));

  tr.classList.add("seleccionada");
  seleccionada = tr.dataset.id;

  if (puedeGestionar) {
    document.getElementById("btnModificar").disabled = false;
    document.getElementById("btnEliminar").disabled = false;
  }
}

/* ================= BUSCADOR ================= */
document.getElementById("buscador").oninput = (e) => {
  const texto = e.target.value.toLowerCase();

  const filtradas = actividades.filter(a =>
    (a.nombre || "").toLowerCase().includes(texto) ||
    (a.descripcion || "").toLowerCase().includes(texto)
  );

  pintarTabla(filtradas);
};

/* ================= CRUD ================= */
document.getElementById("btnCrear").onclick = () => {
  location.href = "actividades-form.html";
};

document.getElementById("btnModificar").onclick = () => {
  if (seleccionada) {
    location.href = `actividades-form.html?id=${seleccionada}`;
  }
};

document.getElementById("btnEliminar").onclick = () => {
  document.getElementById("modalEliminar").style.display = "block";
};

document.getElementById("cancelarEliminar").onclick = () => {
  document.getElementById("modalEliminar").style.display = "none";
};

document.getElementById("confirmarEliminar").onclick = async () => {
  const { error } = await supabase
    .from("actividades")
    .delete()
    .eq("id", seleccionada);

  if (error) {
    alert("Error eliminando actividad");
    return;
  }

  document.getElementById("modalEliminar").style.display = "none";
  seleccionada = null;

  document.getElementById("btnModificar").disabled = true;
  document.getElementById("btnEliminar").disabled = true;

  await cargarActividades();
};

/* ================= INIT ================= */
cargarActividades();
</script>

</body>
</html>
