<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hijo - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .nav-container {
      margin: 10px 0 20px 0;
    }

    .nav-btn {
      background: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<header>
  Hijo

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <div class="nav-container">
    <button id="btnVolver" class="nav-btn">Volver</button>
    <button id="btnInicio" class="nav-btn">Inicio</button>
  </div>

  <h2 id="titulo">Añadir hijo</h2>

  <input id="nombre" type="text" placeholder="Nombre">
  <input id="apellidos" type="text" placeholder="Apellidos">
  <input id="curso" type="text" placeholder="Curso (opcional)">
  <input id="fecha_nacimiento" type="date">

  <h3>Inscribir en actividad</h3>
  <select id="actividadSelect">
    <option value="">— No inscribir —</option>
  </select>

  <button id="btnGuardar">Guardar</button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* SESIÓN */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* PERFIL — AHORA CON avatar_url */
const { data: profile } = await supabase
  .from("profiles")
  .select("role, avatar_url")
  .eq("id", user.id)
  .maybeSingle();

if (!profile || profile.role !== "familiar") {
  alert("Solo los familiares pueden acceder");
  location.href = "./login.html";
}

/* UI PERFIL */
document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: " + profile.role;

if (profile.avatar_url) {
  document.getElementById("profileToggle").src = profile.avatar_url;
}

/* MENÚ PERFIL */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* BOTONES */
document.getElementById("btnVolver").onclick = () => {
  location.href = "./mis-hijos.html";
};

document.getElementById("btnInicio").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* ID HIJO */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* CARGAR ACTIVIDADES */
async function cargarActividades() {
  const { data } = await supabase
    .from("actividades")
    .select("id, nombre")
    .order("nombre");

  const sel = document.getElementById("actividadSelect");

  data?.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a.id;
    opt.textContent = a.nombre;
    sel.appendChild(opt);
  });
}

await cargarActividades();

/* MODO EDICIÓN */
if (id) {
  document.getElementById("titulo").textContent = "Editar hijo";
  cargarHijo();
}

/* CARGAR HIJO */
async function cargarHijo() {
  const { data: hijo } = await supabase
    .from("alumnos")
    .select("*")
    .eq("id", id)
    .eq("familiar_id", user.id)
    .maybeSingle();

  if (!hijo) {
    alert("Error cargando hijo");
    location.href = "./mis-hijos.html";
    return;
  }

  document.getElementById("nombre").value = hijo.nombre;
  document.getElementById("apellidos").value = hijo.apellidos;
  document.getElementById("curso").value = hijo.curso || "";
  document.getElementById("fecha_nacimiento").value = hijo.fecha_nacimiento || "";
}

/* GUARDAR */
document.getElementById("btnGuardar").onclick = async () => {

  const nombre = document.getElementById("nombre").value.trim();
  const apellidos = document.getElementById("apellidos").value.trim();
  const curso = document.getElementById("curso").value.trim() || null;
  const fecha_nacimiento = document.getElementById("fecha_nacimiento").value || null;
  const actividad_id = document.getElementById("actividadSelect").value;

  if (!nombre || !apellidos) {
    alert("Nombre y apellidos son obligatorios");
    return;
  }

  const datos = {
    nombre,
    apellidos,
    curso,
    fecha_nacimiento,
    familiar_id: user.id
  };

  let hijo_id = id;

  /* CREAR O ACTUALIZAR HIJO */
  if (id) {
    const { error } = await supabase
      .from("alumnos")
      .update(datos)
      .eq("id", id)
      .eq("familiar_id", user.id);

    if (error) return alert("Error actualizando hijo");

  } else {
    const { data, error } = await supabase
      .from("alumnos")
      .insert([datos])
      .select()
      .single();

    if (error) return alert("Error creando hijo");

    hijo_id = data.id;
  }

  /* INSCRIPCIÓN AUTOMÁTICA */
  if (actividad_id) {
    await supabase
      .from("inscripciones")
      .insert({
        alumno_id: hijo_id,
        actividad_id,
        familiar_id: user.id,
        fecha_inscripcion: new Date().toISOString()
      });
  }

  alert("Guardado correctamente");
  location.href = "./mis-hijos.html";
};
</script>

</body>
</html>
