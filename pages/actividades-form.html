<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title id="titulo">Crear actividad - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .nav-container {
      margin: 10px 0 20px 0;
    }
    .nav-btn {
      background: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #btnGuardar {
      background-color: #c62828;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 15px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header id="headerTitulo">Crear actividad</header>

<div class="container">

  <div class="nav-container">
    <button onclick="location.href='actividades.html'" class="nav-btn">Volver</button>
    <button onclick="location.href='admin.html'" class="nav-btn">Inicio</button>
  </div>

  <h2 id="subtitulo">Crear actividad</h2>

  <input id="nombre" type="text" placeholder="Nombre de la actividad">
  <input id="dia1" type="text" placeholder="Día 1 (lunes, martes...)">
  <input id="dia2" type="text" placeholder="Día 2 (opcional)">
  <textarea id="descripcion" placeholder="Descripción"></textarea>

  <label>Monitor</label>
  <select id="monitor"></select>

  <label>Material</label>
  <select id="material"></select>

  <label>Zona</label>
  <select id="zona"></select>

  <button id="btnGuardar">Guardar actividad</button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ================= SESIÓN ================= */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* ================= OBTENER ID SI VIENE ================= */
const params = new URLSearchParams(window.location.search);
const actividadId = params.get("id"); // null si es crear

/* ================= CARGAR SELECTS ================= */
async function cargarSelects() {
  const selMonitor = document.getElementById("monitor");
  const selMaterial = document.getElementById("material");
  const selZona = document.getElementById("zona");

  // Monitores
  const { data: monitores } = await supabase
    .from("profiles")
    .select("id, nombre, apellidos")
    .eq("role", "monitor");

  selMonitor.innerHTML = monitores
    .map(m => `<option value="${m.id}">${m.nombre} ${m.apellidos}</option>`)
    .join("");

  // Materiales
  const { data: materiales } = await supabase
    .from("materiales")
    .select("*");

  selMaterial.innerHTML = materiales
    .map(m => `<option value="${m.id}">${m.nombre}</option>`)
    .join("");

  // Zonas
  const { data: zonas } = await supabase
    .from("zonas")
    .select("*");

  selZona.innerHTML = zonas
    .map(z => `<option value="${z.id}">${z.nombre}</option>`)
    .join("");
}

/* ================= CARGAR DATOS SI ES EDICIÓN ================= */
async function cargarActividad() {
  if (!actividadId) return; // es creación

  document.getElementById("titulo").textContent = "Modificar actividad";
  document.getElementById("headerTitulo").textContent = "Modificar actividad";
  document.getElementById("subtitulo").textContent = "Modificar actividad";

  const { data, error } = await supabase
    .from("actividades")
    .select("*")
    .eq("id", actividadId)
    .maybeSingle();

  if (error || !data) {
    alert("Error cargando actividad");
    return;
  }

  // Rellenar campos
  document.getElementById("nombre").value = data.nombre;
  document.getElementById("dia1").value = data.dia1;
  document.getElementById("dia2").value = data.dia2 || "";
  document.getElementById("descripcion").value = data.descripcion;

  document.getElementById("monitor").value = data.monitor_id;
  document.getElementById("material").value = data.material_id;
  document.getElementById("zona").value = data.zona_id;
}

/* ================= GUARDAR ================= */
document.getElementById("btnGuardar").onclick = async () => {
  const payload = {
    nombre: document.getElementById("nombre").value.trim(),
    dia1: document.getElementById("dia1").value.trim(),
    dia2: document.getElementById("dia2").value.trim(),
    descripcion: document.getElementById("descripcion").value.trim(),
    monitor_id: document.getElementById("monitor").value,
    material_id: document.getElementById("material").value,
    zona_id: document.getElementById("zona").value
  };

  if (!payload.nombre || !payload.dia1 || !payload.descripcion) {
    alert("Rellena los campos obligatorios");
    return;
  }

  let error;

  if (actividadId) {
    // MODO EDITAR
    ({ error } = await supabase
      .from("actividades")
      .update(payload)
      .eq("id", actividadId));
  } else {
    // MODO CREAR
    ({ error } = await supabase
      .from("actividades")
      .insert(payload));
  }

  if (error) {
    alert("Error guardando actividad");
    console.error(error);
    return;
  }

  alert("Actividad guardada correctamente");
  location.href = "./actividades.html";
};

/* ================= INIT ================= */
await cargarSelects();
await cargarActividad();
</script>

</body>
</html>
