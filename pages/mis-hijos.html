<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis hijos - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .card {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .card button {
      margin-right: 10px;
      margin-top: 10px;
      background: #1976d2;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    #btnNuevo {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<header>
  Mis hijos

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <h2>Mis hijos</h2>

  <button id="btnNuevo">Añadir hijo</button>

  <div id="lista"></div>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* SESIÓN */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* PERFIL */
const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (!profile || profile.role !== "familiar") {
  alert("Solo los familiares pueden acceder");
  location.href = "./login.html";
}

/* UI PERFIL */
document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: " + profile.role;

/* MENÚ PERFIL */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* CARGAR HIJOS */
async function cargarHijos() {
  const { data, error } = await supabase
    .from("alumnos")
    .select("*")
    .eq("familiar_id", user.id)
    .order("nombre");

  const cont = document.getElementById("lista");

  if (error) {
    cont.innerHTML = "<p>Error cargando hijos.</p>";
    return;
  }

  if (!data || data.length === 0) {
    cont.innerHTML = "<p>No tienes hijos registrados.</p>";
    return;
  }

  cont.innerHTML = data.map(h => `
    <div class="card">
      <h3>${h.nombre} ${h.apellidos}</h3>
      <p><strong>Curso:</strong> ${h.curso || "—"}</p>
      <p><strong>Nacimiento:</strong> ${h.fecha_nacimiento || "—"}</p>

      <button onclick="location.href='./mis-hijos-form.html?id=${h.id}'">Editar</button>
      <button onclick="location.href='./mis-hijos-actividades.html?id=${h.id}'">Inscribir en actividades</button>
    </div>
  `).join("");
}

cargarHijos();

/* NUEVO HIJO */
document.getElementById("btnNuevo").onclick = () => {
  location.href = "./mis-hijos-form.html";
};
</script>

</body>
</html>
