<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis hijos - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .card {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    /* ❌ ELIMINADO: .card button azul */
    /* ❌ ELIMINADO: #btnNuevo verde */
    /* ❌ ELIMINADO: .nav-btn gris */

    /* 🔥 NUEVO: TODOS LOS BOTONES USAN EL ESTILO GLOBAL DEL ADMIN */
    .btn-admin {
      background: #c62828;
      color: #ffeb3b;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      width: 100%;
      margin-top: 10px;
      display: block;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  Mis hijos

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- 🔥 BOTONES ROJOS IGUALES QUE ADMIN -->
  <button id="btnVolver" class="btn-admin">Volver</button>
  <button id="btnInicio" class="btn-admin">Inicio</button>

  <h2>Mis hijos</h2>

  <!-- 🔥 BOTÓN AÑADIR HIJO IGUAL QUE ADMIN -->
  <button id="btnNuevo" class="btn-admin">Añadir hijo</button>

  <div id="lista"></div>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* SESIÓN */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* PERFIL */
const { data: profile } = await supabase
  .from("profiles")
  .select("role, avatar_url")
  .eq("id", user.id)
  .maybeSingle();

document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: " + (profile?.role ?? "desconocido");

if (profile?.avatar_url) {
  document.getElementById("profileToggle").src = profile.avatar_url;
}

/* MENÚ PERFIL */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* BOTONES NAV */
document.getElementById("btnVolver").onclick = () => {
  location.href = "./familiar.html";
};

document.getElementById("btnInicio").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* CARGAR HIJOS */
async function cargarHijos() {
  const { data, error } = await supabase
    .from("alumnos")
    .select("*")
    .eq("familiar_id", user.id)
    .order("nombre");

  const cont = document.getElementById("lista");

  if (error) {
    cont.innerHTML = "<p>Error cargando hijos.</p>";
    return;
  }

  if (!data || data.length === 0) {
    cont.innerHTML = "<p>No tienes hijos registrados.</p>";
    return;
  }

  cont.innerHTML = data.map(h => `
    <div class="card">
      <h3>${h.nombre} ${h.apellidos}</h3>
      <p><strong>Curso:</strong> ${h.curso || "—"}</p>
      <p><strong>Nacimiento:</strong> ${h.fecha_nacimiento || "—"}</p>

      <!-- 🔥 BOTÓN EDITAR IGUAL QUE ADMIN -->
      <button class="btn-admin" onclick="location.href='./mis-hijos-form.html?id=${h.id}'">Editar</button>
    </div>
  `).join("");
}

cargarHijos();

/* NUEVO HIJO */
document.getElementById("btnNuevo").onclick = () => {
  location.href = "./mis-hijos-form.html";
};
</script>

</body>
</html>
