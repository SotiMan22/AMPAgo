<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Familiar - AMPAgo</title>

  <!-- RUTA CORRECTA PARA VERCEL -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  Panel Familiar

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- TEXTO DINÁMICO -->
  <h2 id="bienvenida"></h2>

  <button onclick="location.href='./mis-hijos.html'">
    Mis hijos
  </button>

  <button onclick="location.href='./actividades-disponibles.html'">
    Actividades disponibles
  </button>

  <button onclick="location.href='./anuncios.html'">
    Tablón de anuncios
  </button>

</div>

<script type="module">

/* RUTA CORRECTA PARA VERCEL */
import { supabase } from "../js/supabaseclientes.js";

/* ============================================================
   SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();

if (!user) {
  location.href = "./login.html";
}

/* ============================================================
   PERFIL
============================================================ */
const { data: profile, error } = await supabase
  .from("profiles")
  .select("role, nombre, apellidos")
  .eq("id", user.id)
  .maybeSingle();

if (error || !profile) {
  alert("Error cargando perfil");
  location.href = "./login.html";
}

/* ============================================================
   CONTROL DE ACCESO
============================================================ */
if (profile.role !== "familiar") {
  alert("Acceso restringido a familiares");
  location.href = "./login.html";
}

/* ============================================================
   UI PERFIL + BIENVENIDA
============================================================ */
document.getElementById("profileEmail").textContent = user.email || "";
document.getElementById("profileRole").textContent = "Rol: " + profile.role;

document.getElementById("bienvenida").textContent =
  `Bienvenido, ${profile.role} ${profile.nombre} ${profile.apellidos}`;

/* ============================================================
   MENÚ PERFIL
============================================================ */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* ============================================================
   LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};
</script>

</body>
</html>
