<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Familiar - AMPAgo</title>

  <!-- RUTA CORRECTA PARA VERCEL -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  Panel Familiar

  <div class="profile-menu">
    <!-- ICONO DEL FAMILIAR -->
    <img src="../imagenes/familiar.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- TEXTO DINÁMICO -->
  <h2 id="bienvenida"></h2>

  <button onclick="location.href='./mis-hijos.html'">
    Mis hijos
  </button>

  <button onclick="location.href='./actividades.html'">
    Actividades disponibles
  </button>

  <button onclick="location.href='./anuncios.html'">
    Tablón de anuncios
  </button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ============================================================
   1. SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();

if (!user) {
  location.href = "./login.html";
}

/* ============================================================
   2. PERFIL — CORREGIDO PARA NO EXPULSAR SI TARDA EN CARGAR
============================================================ */
const { data: profile, error } = await supabase
  .from("profiles")
  .select("role, nombre, apellidos, avatar_url")
  .eq("id", user.id)
  .maybeSingle();

console.log("DEBUG FAMILIAR:", profile, error);

/* Si hay error grave, sí expulsamos */
if (error) {
  alert("Error cargando perfil");
  location.href = "./login.html";
}

/* ============================================================
   3. CONTROL DE ACCESO — SOLO EXPULSA SI EL ROL ES INCORRECTO
============================================================ */
const role = (profile?.role ?? "").trim().toLowerCase();

/* Si el rol llega vacío, null o tarda → NO expulsamos */
if (role && role !== "familiar") {
  alert("Acceso restringido a familiares");
  location.href = "./login.html";
}

/* ============================================================
   4. UI PERFIL + BIENVENIDA
============================================================ */
document.getElementById("profileEmail").textContent = user.email || "";
document.getElementById("profileRole").textContent = "Rol: familiar";

document.getElementById("bienvenida").textContent =
  `Bienvenido, ${profile?.nombre ?? ""} ${profile?.apellidos ?? ""}`;

/* Mostrar avatar si existe */
if (profile?.avatar_url) {
  document.getElementById("profileToggle").src = profile.avatar_url;
}

/* ============================================================
   5. MENÚ PERFIL
============================================================ */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* ============================================================
   6. LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};
</script>

</body>
</html>
