<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tablón de anuncios - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .nav-container { margin: 10px 0 20px 0; }
    .nav-btn {
      background: #eee; border: 1px solid #ccc;
      padding: 6px 12px; margin-right: 10px;
      cursor: pointer; border-radius: 4px;
    }
    .anuncio {
      background: white; padding: 15px; margin-bottom: 15px;
      border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    #btnCrear {
      background-color: #c62828; color: white;
      border: none; padding: 10px 15px;
      border-radius: 6px; cursor: pointer;
      margin-bottom: 20px; display: none;
    }
  </style>
</head>

<body>

<header>Tablón de anuncios</header>

<div class="container">

  <div class="nav-container">
    <button id="btnVolver" class="nav-btn">Volver</button>
    <button id="btnInicio" class="nav-btn">Inicio</button>
  </div>

  <h2>Anuncios</h2>

  <button id="btnCrear">Crear anuncio</button>

  <div id="listaAnuncios">Cargando anuncios...</div>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ============================
   1. SESIÓN
============================ */
const esInvitado = localStorage.getItem("invitado") === "true";
const { data: { user } } = await supabase.auth.getUser();

if (esInvitado) {
  alert("Los invitados no pueden acceder al tablón");
  location.href = "./invitado.html";
  return;
}

if (!user) location.href = "./login.html";

/* ============================
   2. ROL REAL
============================ */
let role = null;

const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

role = (profile?.role ?? "").trim().toLowerCase();

/* ============================
   3. BOTÓN CREAR
============================ */
if (role === "admin" || role === "monitor") {
  document.getElementById("btnCrear").style.display = "inline-block";
}

/* ============================
   4. BOTÓN VOLVER
============================ */
const params = new URLSearchParams(window.location.search);
const origen = params.get("rol");

document.getElementById("btnVolver").onclick = () => {
  if (origen === "monitor") location.href = "./monitor.html";
  else if (origen === "admin") location.href = "./admin.html";
  else location.href = "./familiar.html";
};

/* ============================
   5. INICIO (LOGOUT)
============================ */
document.getElementById("btnInicio").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* ============================
   6. CARGAR ANUNCIOS
============================ */
async function cargarAnuncios() {
  const { data, error } = await supabase
    .from("anuncios")
    .select("*")
    .order("fecha", { ascending: false });

  const cont = document.getElementById("listaAnuncios");

  if (error) {
    cont.textContent = "Error cargando anuncios";
    return;
  }

  if (!data.length) {
    cont.textContent = "No hay anuncios";
    return;
  }

  cont.innerHTML = data.map(a => `
    <div class="anuncio">
      <h3>${a.titulo}</h3>
      <p>${a.mensaje}</p>
      <small>${new Date(a.fecha).toLocaleString()}</small>
    </div>
  `).join("");
}

cargarAnuncios();

/* ============================
   7. CREAR ANUNCIO
============================ */
document.getElementById("btnCrear").onclick = () => {
  location.href = "./anuncios-form.html?rol=" + origen;
};

/* ============================
   8. BLOQUEAR RETROCESO
============================ */
history.pushState(null, null, location.href);
window.onpopstate = () => history.go(1);
</script>

</body>
</html>
