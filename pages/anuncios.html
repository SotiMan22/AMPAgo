<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del monitor - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .btn {
      background-color: #c62828;
      color: white;
      border: none;
      padding: 12px 18px;
      margin: 10px 0;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>Panel del monitor</header>

<div class="container">

  <button id="btnMisActividades" class="btn">Mis actividades</button>
  <button id="btnActividades" class="btn">Actividades</button>
  <button id="btnAnuncios" class="btn">Tablón de anuncios</button>

  <button id="btnLogout" class="btn" style="background:#555;">Cerrar sesión</button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ================= SESIÓN ================= */
const esInvitado = localStorage.getItem("invitado") === "true";
const { data: { user } } = await supabase.auth.getUser();

if (esInvitado) {
  alert("Los invitados no pueden acceder");
  location.href = "./invitado.html";
  return;
}

if (!user) {
  location.href = "./login.html";
  return;
}

/* ================= VERIFICAR ROL ================= */
const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (profile?.role !== "monitor") {
  alert("Acceso restringido a monitores");
  location.href = "./login.html";
  return;
}

/* ================= BOTONES ================= */
document.getElementById("btnMisActividades").onclick = () => {
  location.href = "./mis-actividades.html";
};

document.getElementById("btnActividades").onclick = () => {
  location.href = "./actividades.html";
};

document.getElementById("btnAnuncios").onclick = () => {
  location.href = "./anuncios.html";
};

document.getElementById("btnLogout").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};
</script>

</body>
</html>
