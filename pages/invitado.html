<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitado - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .nav-container {
      margin: 10px 0 20px 0;
    }
    .nav-btn {
      background: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<header>
  Panel Invitado

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p>Invitado</p>
      <p>Rol: invitado</p>

      <button id="btnLogin">Iniciar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <div class="nav-container">
    <button id="btnVolver" class="nav-btn">Volver</button>
    <button id="btnInicio" class="nav-btn">Inicio</button>
  </div>

  <h2>Bienvenido</h2>

  <p>Puedes ver las actividades disponibles sin iniciar sesión.</p>

  <button id="btnActividades">
    Actividades disponibles
  </button>

</div>

<script>
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

document.getElementById("btnVolver").onclick = () => {
  location.href = "./login.html";
};

document.getElementById("btnInicio").onclick = () => {
  location.href = "./login.html";
};

history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.go(1);
};

document.getElementById("btnLogin").onclick = () => {
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

document.getElementById("btnActividades").onclick = () => {
  localStorage.setItem("invitado", "true");
  location.href = "./actividades-familiar.html";
};
</script>

</body>
</html>
