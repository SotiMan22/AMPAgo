<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo anuncio - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .nav-container {
      margin: 10px 0 20px 0;
    }
    .nav-btn {
      background: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #btnGuardar {
      background-color: #c62828;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 15px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>Nuevo anuncio</header>

<div class="container">

  <!-- Navegación universal -->
  <div class="nav-container">
    <button id="btnVolver" class="nav-btn">Volver</button>
    <button id="btnInicio" class="nav-btn">Inicio</button>
  </div>

  <h2>Crear anuncio</h2>

  <input id="titulo" type="text" placeholder="Título del anuncio">
  <textarea id="mensaje" placeholder="Mensaje"></textarea>

  <button id="btnGuardar">Publicar</button>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ============================================================
   1. SESIÓN
============================================================ */
const esInvitado = localStorage.getItem("invitado") === "true";
const { data: { user } } = await supabase.auth.getUser();

if (esInvitado) {
  alert("Los invitados no pueden publicar anuncios");
  location.href = "./anuncios.html";
}

if (!user) {
  location.href = "./login.html";
}

/* ============================================================
   2. PERFIL Y PERMISOS
============================================================ */
const { data: profile } = await supabase
  .from("profiles")
  .select("role, avatar_url")
  .eq("id", user.id)
  .maybeSingle();

if (!profile || !["admin", "monitor"].includes(profile.role)) {
  alert("Solo administradores y monitores pueden publicar anuncios");
  location.href = "./anuncios.html";
}

/* Avatar persistente */
const icono = document.getElementById("profileToggle");
if (icono && profile.avatar_url) {
  icono.src = profile.avatar_url;
}

/* ============================================================
   3. NAVEGACIÓN UNIVERSAL
============================================================ */
document.getElementById("btnVolver").onclick = () => {
  switch (profile.role) {
    case "admin": location.href = "./admin.html"; break;
    case "monitor": location.href = "./monitor.html"; break;
    default: location.href = "./anuncios.html";
  }
};

document.getElementById("btnInicio").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* ============================================================
   4. BLOQUEAR RETROCESO
============================================================ */
history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.go(1);
};

/* ============================================================
   5. GUARDAR ANUNCIO
============================================================ */
document.getElementById("btnGuardar").onclick = async () => {
  const titulo = document.getElementById("titulo").value.trim();
  const mensaje = document.getElementById("mensaje").value.trim();

  if (!titulo) return alert("El título es obligatorio");
  if (!mensaje) return alert("El mensaje es obligatorio");

  const { error } = await supabase
    .from("anuncios")
    .insert({
      titulo,
      mensaje,
      fecha: new Date().toISOString(),
      autor_id: user.id
    });

  if (error) {
    console.error(error);
    alert("Error publicando anuncio");
    return;
  }

  alert("Anuncio publicado correctamente");
  location.href = "./anuncios.html";
};
</script>

</body>
</html>
