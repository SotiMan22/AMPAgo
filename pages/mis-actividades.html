<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis actividades - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .card {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .card h3 {
      margin: 0 0 8px 0;
    }

    .card button {
      margin-top: 10px;
      background: #ff8c00;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  Mis actividades

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">
  <h2>Actividades asignadas</h2>
  <div id="lista"></div>
</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ============================================================
   1. SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();

if (!user) {
  location.href = "./login.html";
}

/* ============================================================
   2. PERFIL — CORREGIDO PARA NO EXPULSAR SI TARDA
============================================================ */
const { data: profile, error } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

/* Error REAL → expulsar */
if (error) {
  console.error(error);
  alert("No se pudo cargar el perfil");
  location.href = "./login.html";
}

/* Rol seguro */
const role = (profile?.role ?? "").trim().toLowerCase();

/* SOLO expulsar si el rol REAL es incorrecto */
if (role && role !== "monitor") {
  alert("Solo los monitores pueden acceder");
  location.href = "./login.html";
}

/* ============================================================
   3. UI PERFIL
============================================================ */
document.getElementById("profileEmail").textContent = user.email || "";
document.getElementById("profileRole").textContent = "Rol: monitor";

/* ============================================================
   4. MENÚ PERFIL
============================================================ */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* ============================================================
   5. LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "./login.html";
};

/* ============================================================
   6. ACTIVIDADES DEL MONITOR — COLUMNA CORRECTA
============================================================ */
async function cargarActividades() {
  const { data, error } = await supabase
    .from("actividades")
    .select("*")
    .eq("monitor", user.id)   // ← ESTA ES LA COLUMNA CORRECTA
    .order("nombre", { ascending: true });

  const cont = document.getElementById("lista");

  if (error) {
    console.error(error);
    cont.innerHTML = "<p>Error cargando actividades.</p>";
    return;
  }

  if (!data || data.length === 0) {
    cont.innerHTML = "<p>No tienes actividades asignadas.</p>";
    return;
  }

  cont.innerHTML = data.map(a => `
    <div class="card">
      <h3>${a.nombre}</h3>

      <p><strong>Día 1:</strong> ${a.dia1 || ""}</p>
      <p><strong>Día 2:</strong> ${a.dia2 || "—"}</p>
      <p>${a.descripcion || ""}</p>

      <button onclick="location.href='./mis-alumnos.html?id=${a.id}'">
        Ver alumnos
      </button>
    </div>
  `).join("");
}

cargarActividades();
</script>

</body>
</html>
