<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividades - Familiar</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
  Actividades

  <div class="profile-menu">
    <img src="../imagenes/familiar.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <h2>Actividades disponibles</h2>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Día 1</th>
        <th>Día 2</th>
        <th>Descripción</th>
        <th>Monitor</th>
        <th>Material</th>
        <th>Zona</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* SESIÓN */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* PERFIL */
const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (!profile || profile.role !== "familiar") {
  alert("Acceso restringido");
  location.href = "./login.html";
}

document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: familiar";

/* CARGAR ACTIVIDADES */
async function cargar() {
  const { data } = await supabase.from("actividades").select("*");

  const cont = document.getElementById("lista");

  cont.innerHTML = data.map(a => `
    <tr>
      <td>${a.nombre}</td>
      <td>${a.dia1}</td>
      <td>${a.dia2}</td>
      <td>${a.descripcion}</td>
      <td>${a.monitor_id}</td>
      <td>${a.material_id}</td>
      <td>${a.zona_id}</td>
    </tr>
  `).join("");
}

cargar();

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  location.href = "./login.html";
};
</script>

</body>
</html>
