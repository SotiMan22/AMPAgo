<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin - AMPAgo</title>

  <!-- RUTA CORREGIDA -->
  <link rel="stylesheet" href="/AMPAgo/style.css">
</head>

<body>

<header>
  Panel Administrador

  <div class="profile-menu">
    <!-- RUTA CORREGIDA -->
    <img src="/AMPAgo/img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <h2>Bienvenido, administrador</h2>

  <button onclick="location.href='/AMPAgo/pages/register.html'">
    Crear nueva cuenta
  </button>

  <button onclick="location.href='/AMPAgo/pages/actividades.html'">
    Gestionar actividades
  </button>

  <button onclick="location.href='/AMPAgo/pages/anuncios.html'">
    Tablón de anuncios
  </button>

  <!-- ❌ BOTÓN DE CREAR ANUNCIO ELIMINADO -->
  
</div>

<script type="module">

/* RUTA CORREGIDA */
import { supabase } from "/AMPAgo/js/supabaseclientes.js";

/* ============================================================
   SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();

if (!user) {
  location.href = "/AMPAgo/pages/login.html";
}

/* ============================================================
   PERFIL
============================================================ */
const { data: profile, error } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (error || !profile) {
  alert("Error cargando perfil");
  location.href = "/AMPAgo/pages/login.html";
}

/* ============================================================
   CONTROL DE ACCESO
============================================================ */
if (profile.role !== "admin") {
  alert("Acceso restringido a administradores");
  location.href = "/AMPAgo/pages/login.html";
}

/* ============================================================
   UI PERFIL
============================================================ */
document.getElementById("profileEmail").textContent = user.email || "";
document.getElementById("profileRole").textContent = "Rol: " + profile.role;

/* ============================================================
   MENÚ PERFIL
============================================================ */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* ============================================================
   LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem("invitado");
  location.href = "/AMPAgo/pages/login.html";
};
</script>

</body>
</html>
