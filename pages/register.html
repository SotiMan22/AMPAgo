<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividades - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .admin-buttons {
      margin-bottom: 15px;
    }
    .admin-buttons button {
      margin-right: 10px;
    }
  </style>
</head>

<body>

<header>
  Actividades

  <div class="profile-menu">
    <img src="../img/user.png" class="profile-icon" id="profileToggle">

    <div class="profile-dropdown" id="profileDropdown">
      <p id="profileEmail"></p>
      <p id="profileRole"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- BOTONES ADMIN (OCULTOS POR DEFECTO) -->
  <div id="adminControls" class="admin-buttons" style="display:none;">
    <button onclick="location.href='./crear-actividad.html'">Crear actividad</button>
  </div>

  <h2>Lista de actividades</h2>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Día 1</th>
        <th>Día 2</th>
        <th>Descripción</th>
        <th>Monitor</th>
        <th>Material</th>
        <th>Zona</th>
        <th id="accionesHeader" style="display:none;">Acciones</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* ============================================================
   SESIÓN
============================================================ */
const { data: { user } } = await supabase.auth.getUser();
if (!user) location.href = "./login.html";

/* ============================================================
   PERFIL
============================================================ */
const { data: profile } = await supabase
  .from("profiles")
  .select("role")
  .eq("id", user.id)
  .maybeSingle();

if (!profile) {
  alert("No se pudo cargar el perfil");
  location.href = "./login.html";
}

const role = profile.role;
document.getElementById("profileEmail").textContent = user.email;
document.getElementById("profileRole").textContent = "Rol: " + role;

/* ============================================================
   MENÚ PERFIL
============================================================ */
document.getElementById("profileToggle").onclick = () => {
  const d = document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile-menu")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});

/* ============================================================
   LOGOUT
============================================================ */
document.getElementById("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  location.href = "./login.html";
};

/* ============================================================
   CARGAR ACTIVIDADES SEGÚN ROL
============================================================ */
async function cargarActividades() {
  let query = supabase.from("actividades").select("*");

  // MONITOR → solo sus actividades
  if (role === "monitor") {
    query = query.eq("monitor_id", user.id);
  }

  const { data, error } = await query;

  if (error) {
    alert("Error cargando actividades");
    return;
  }

  const cont = document.getElementById("lista");

  cont.innerHTML = data.map(a => `
    <tr>
      <td>${a.nombre}</td>
      <td>${a.dia1}</td>
      <td>${a.dia2}</td>
      <td>${a.descripcion}</td>
      <td>${a.monitor_id}</td>
      <td>${a.material_id}</td>
      <td>${a.zona_id}</td>

      ${
        role === "admin"
        ? `<td>
             <button onclick="location.href='./modificar-actividad.html?id=${a.id}'">Modificar</button>
             <button onclick="eliminar(${a.id})">Eliminar</button>
           </td>`
        : ""
      }
    </tr>
  `).join("");

  // Mostrar controles admin
  if (role === "admin") {
    document.getElementById("adminControls").style.display = "block";
    document.getElementById("accionesHeader").style.display = "table-cell";
  }
}

cargarActividades();

/* ============================================================
   ELIMINAR ACTIVIDAD (SOLO ADMIN)
============================================================ */
async function eliminar(id) {
  if (role !== "admin") return;

  if (!confirm("¿Eliminar actividad?")) return;

  const { error } = await supabase
    .from("actividades")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Error eliminando actividad");
    return;
  }

  alert("Actividad eliminada");
  cargarActividades();
}

</script>

</body>
</html>
