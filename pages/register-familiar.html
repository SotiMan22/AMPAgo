<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro Familiar - AMPAgo</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    /* Botones iguales que admin */
    .btn-rojo {
      background: #c62828;
      color: yellow;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      width: 100%;
      margin-top: 10px;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
      max-width: 400px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* Botón registrar azul */
    .btn-registrar {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>Registro Familiar</header>

<div class="container">

  <!-- 🔥 BOTONES ROJOS COMO EN ADMIN -->
  <button id="btnVolver" class="btn-rojo">Volver</button>
  <button id="btnInicio" class="btn-rojo">Inicio</button>

  <div class="form-container">

    <h2>Crear cuenta de familiar</h2>

    <input id="nombre" type="text" placeholder="Nombre">
    <input id="apellidos" type="text" placeholder="Apellidos">
    <input id="email" type="email" placeholder="Correo electrónico">
    <input id="password" type="password" placeholder="Contraseña">

    <button id="btnRegistrar" class="btn-registrar">Registrarse</button>

  </div>

</div>

<script type="module">
import { supabase } from "../js/supabaseclientes.js";

/* BOTÓN VOLVER → PÁGINA ANTERIOR */
document.getElementById("btnVolver").onclick = () => {
  history.back();
};

/* BOTÓN INICIO → LOGIN */
document.getElementById("btnInicio").onclick = () => {
  location.href = "./login.html";
};

/* BLOQUEAR RETROCESO */
history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.go(1);
};

/* REGISTRO */
document.getElementById("btnRegistrar").onclick = async () => {

  const nombre = document.getElementById("nombre").value.trim();
  const apellidos = document.getElementById("apellidos").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!nombre || !apellidos || !email || !password) {
    alert("Todos los campos son obligatorios");
    return;
  }

  const btn = document.getElementById("btnRegistrar");
  btn.disabled = true;
  btn.textContent = "Creando cuenta...";

  try {
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) throw error;

    const user = data.user;

    await supabase.from("profiles").insert([{
      id: user.id,
      email,
      nombre,
      apellidos,
      role: "familiar"
    }]);

    alert("Cuenta creada correctamente");
    localStorage.removeItem("invitado");
    location.href = "./login.html";

  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Registrarse";
  }
};
</script>

</body>
</html>
